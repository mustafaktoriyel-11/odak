  @keyframes nabiz{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.18)}}

  <g id="s-koordinat"><path d="M12 52 H54 M16 56 V10" stroke="var(--m)" stroke-width="2.4" stroke-linecap="round"/><path d="M54 52 l-5 -3 v6 Z M16 10 l-3 5 h6 Z" fill="var(--m)"/><path d="M20 26 h20 v22" stroke="var(--m)" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/><circle cx="40" cy="26" r="4.2" fill="var(--v)" stroke="var(--m)" stroke-width="1.6"/><path d="M18 48 C30 46 38 34 52 16" stroke="#9FB2FF" stroke-width="2" fill="none"/></g>

<script>
var ROTA = null, ILERLEME = Number((location.hash.match(/s=(\d+)/)||[])[1] || 20), GECE = /gece/.test(location.hash);
document.getElementById('harita').className = 'harita ' + (GECE ? 'gece' : 'gunduz-mod');
fetch('../veri/izinde/rota.json').then(function(r){return r.json();}).then(function(d){ROTA=d;ciz();});

function kontrol(a,b,k){var mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y;return {x:mx-dy*(k||0),y:my+dx*(k||0)};}
function bez(a,c,b,t){var u=1-t;return {x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y};}
function ciz(){
  var D=ROTA.duraklar, svg=document.getElementById('kat'), h='';
  var m=GECE?'#CFE0FF':'#141B3F', v='#FF8A1F', yolSoluk=GECE?'rgba(159,178,255,.55)':'rgba(20,27,63,.45)';
  // yol: tamamı soluk noktalı, geçilen kısım turuncu
  for(var i=1;i<D.length;i++){
    var a=D[i-1],b=D[i],c=kontrol(a,b,b.kavis), p='M'+a.x+' '+a.y+' Q'+c.x+' '+c.y+' '+b.x+' '+b.y;
    h+='<path d="'+p+'" fill="none" stroke="'+yolSoluk+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(b.deniz?'14 12':'1 12')+'"/>';
    var t = ILERLEME>=b.adim?1:(ILERLEME<=a.adim?0:(ILERLEME-a.adim)/(b.adim-a.adim));
    if(t>0){var n=24,q='M'+a.x+' '+a.y;for(var j=1;j<=n;j++){var o=bez(a,c,b,t*j/n);q+=' L'+o.x.toFixed(1)+' '+o.y.toFixed(1);}
      h+='<path d="'+q+'" fill="none" stroke="'+v+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(b.deniz?'16 10':'none')+'"/>';}
    if(t>0&&t<1){var kp=bez(a,c,b,t);h+='<g id="maskot" transform="translate('+kp.x+' '+kp.y+')"><circle r="16" fill="'+v+'" stroke="#FFF" stroke-width="4"/></g>';}
  }
  // duraklar
  var simdi=null; D.forEach(function(d){if(ILERLEME>=d.adim)simdi=d;});
  D.forEach(function(d){
    var ulasti=ILERLEME>=d.adim, s=(d===simdi), r=30, bx=d.rozet?d.rozet[0]:d.x, by=d.rozet?d.rozet[1]:d.y;
    // gerçek nokta + (kaydırılmışsa) rozete ince bağ çizgisi
    if(d.rozet)h+='<path d="M'+d.x+' '+d.y+' L'+bx+' '+by+'" stroke="'+(ulasti?m:'#A8AEC8')+'" stroke-width="2" opacity=".7"/>';
    h+='<circle cx="'+d.x+'" cy="'+d.y+'" r="6" fill="'+(ulasti?v:'#B9BDD0')+'" stroke="'+(ulasti?m:'#A8AEC8')+'" stroke-width="2"/>';
    h+='<g transform="translate('+bx+' '+by+')" style="--m:'+(ulasti?m:'#8C93B0')+';--v:'+(ulasti?v:'#B9BDD0')+'" opacity="'+(ulasti?1:.6)+'">';
    if(s)h+='<circle class="simdi-hale" r="'+(r+12)+'" fill="'+v+'"/>';
    h+='<circle r="'+r+'" fill="'+(GECE?'#1A2142':'#FFF8EA')+'" stroke="'+(ulasti?(GECE?'#9FB2FF':'#141B3F'):'#A8AEC8')+'" stroke-width="'+(s?5:3)+'"/>';
    h+='<use href="#s-'+d.simge+'" transform="translate(-22 -22) scale(.69)"/>';
    h+='</g>';
  });
  svg.innerHTML=h;
}
</script>
