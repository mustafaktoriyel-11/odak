<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141B3F">
<title>MF Koç Paneli</title>
<link rel="manifest" href="/koc-manifest.json">
<link rel="icon" href="/koc-192.png">
<link rel="apple-touch-icon" href="/koc-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== MF Koç Paneli =====
   Renkler MF Odak ile ayni: mavi #1E3BD6, turuncu #FF8A1F, lacivert #141B3F, zemin #F4F6FF */
:root{--mavi:#1E3BD6;--turuncu:#FF8A1F;--lac:#141B3F;--zemin:#F4F6FF;--kart:#FFFFFF;--cizgi:#E3E7FA;--yazi:#141B3F;--yazi2:#5A6180;--yesil:#157A49;--kirmizi:#A12A1E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--zemin);color:var(--yazi);font-family:Inter,Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
[hidden]{display:none!important}
.kap{max-width:560px;margin:0 auto}
/* --- giris --- */
#giris{min-height:100vh;background:var(--lac);color:#fff;padding:72px 24px 32px;display:flex;flex-direction:column;gap:28px}
.logo{width:72px;height:72px;border-radius:22px;background:var(--mavi);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:36px;margin:0 auto}
.logo i{font-style:normal;color:var(--turuncu)}
#giris h1{margin:10px 0 4px;text-align:center;font-size:28px}
#giris .alt{margin:0 auto;text-align:center;color:#B7C5FF;font-size:15px;line-height:1.5;max-width:300px}
.g-form{background:#1A2142;border:1px solid #2F3970;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.g-form label{font-size:13px;font-weight:700;color:#D3D9EE}
.g-form input[type=password]{height:50px;border-radius:14px;border:1px solid #3A4BA0;background:#232B52;color:#fff;font:inherit;font-size:17px;padding:0 14px}
.g-hat{display:flex;align-items:center;gap:10px;font-size:14px;color:#D3D9EE;min-height:44px}
.g-hat input{width:20px;height:20px;accent-color:var(--turuncu)}
.g-btn{height:52px;border:0;border-radius:14px;background:var(--turuncu);color:var(--lac);font-size:16px;font-weight:800}
.g-btn:disabled{opacity:.6}
.g-hata{min-height:18px;margin:0;color:#FFB4A9;font-size:13.5px}
.g-not{margin:0;text-align:center;font-size:12.5px;line-height:1.5;color:#9AA4CC}
/* --- ust bant --- */
.ust{background:var(--lac);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 60px}
.ust-s{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ust-b{display:flex;align-items:center;gap:10px;min-width:0}
.mini-logo{width:36px;height:36px;border-radius:10px;background:var(--mavi);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.mini-logo i{font-style:normal;color:var(--turuncu)}
.ust h1{margin:0;font-size:18px;font-weight:800}
.ust small{display:block;color:#B7C5FF;font-size:12.5px}
.ikon-b{width:44px;height:44px;border-radius:12px;border:1px solid #2F3970;background:#1A2142;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ana{padding:0 16px 32px;margin-top:-46px;display:flex;flex-direction:column;gap:14px}
/* --- ozet kutulari --- */
.ozet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.oz{background:var(--kart);border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(15,30,140,.08);display:flex;flex-direction:column;gap:2px;min-width:0}
.oz span{font-size:12px;color:var(--yazi2)}.oz b{font-size:22px;font-weight:800}.oz small{font-size:11.5px;color:var(--yazi2)}
.oz.dikkat{background:#FFF4EA;border:1px solid #FFD2A6;box-shadow:none}.oz.dikkat span,.oz.dikkat b,.oz.dikkat small{color:#9A3412}
.art{color:var(--yesil)!important;font-weight:700}.azal{color:var(--kirmizi)!important;font-weight:700}
/* --- siralama --- */
.sira{display:flex;gap:6px;background:#E3E8FF;border-radius:999px;padding:4px}
.sira button{flex:1;height:36px;border:0;border-radius:999px;background:transparent;color:var(--mavi);font-size:13px;font-weight:700}
.sira button.on{background:var(--mavi);color:#fff}
/* --- ogrenci karti --- */
.ok{display:flex;flex-direction:column;gap:10px;background:var(--kart);border-radius:18px;padding:14px;border:1px solid var(--cizgi);box-shadow:0 2px 10px rgba(15,30,140,.06);text-align:left;width:100%;color:var(--yazi)}
.ok-u{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ok-k{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:40px;height:40px;border-radius:50%;background:#E3E8FF;color:var(--mavi);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.ok-ad{display:flex;flex-direction:column;min-width:0}
.ok-ad b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ok-ad small{font-size:12px;color:var(--yazi2)}
.et{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
.et.kirmizi{background:#FDECEA;color:var(--kirmizi)}.et.turuncu{background:#FFF4EA;color:#9A3412}.et.yesil{background:#E7F7EE;color:var(--yesil)}.et.gri{background:#EEF1FB;color:var(--yazi2)}
.ok-m{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.ok-m div{display:flex;flex-direction:column;gap:1px;min-width:0}
.ok-m span{font-size:11.5px;color:var(--yazi2)}.ok-m b{font-size:15px;font-weight:800}.ok-m small{font-size:11.5px;color:var(--yazi2)}
.spark{display:flex!important;flex-direction:row!important;align-items:flex-end;gap:3px;height:34px}
.spark i{display:block;flex:1;max-width:9px;border-radius:3px 3px 0 0;background:var(--mavi)}
.spark i.bos{background:#DCE2FF}.spark i.son{background:var(--turuncu)}
.ok-a{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #EEF1FB;padding-top:8px;font-size:12px;color:var(--yazi2)}
.ok-a b{color:var(--yazi)}
.bilgi{margin:4px 4px 0;font-size:12px;color:var(--yazi2);text-align:center}
.bos-kutu{background:var(--kart);border-radius:18px;padding:20px;text-align:center;color:var(--yazi2);font-size:14px;line-height:1.5;border:1px solid var(--cizgi)}
.yuk{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px 0;color:var(--yazi2)}
.yuk i{width:18px;height:18px;border-radius:50%;border:3px solid #C9D2F5;border-top-color:var(--mavi);animation:don .8s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
/* --- detay (Sonnet tamamlayacak; temel iskelet) --- */
.d-ust .ikon-b{text-decoration:none}
.aralik{display:flex;gap:6px;margin-top:14px}
.aralik button{height:34px;padding:0 14px;border:1px solid #2F3970;border-radius:999px;background:transparent;color:#B7C5FF;font-size:13px;font-weight:700}
.aralik button.on{background:#fff;border-color:#fff;color:var(--lac)}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kart{background:var(--kart);border-radius:18px;padding:16px;border:1px solid var(--cizgi)}
.kart h2{margin:0 0 10px;font-size:15px}
.aralik button{height:44px}
.kart h2 small{font-weight:500;color:var(--yazi2);font-size:12px;margin-left:6px}
.bos-s{margin:0;color:var(--yazi2);font-size:14px;line-height:1.5}
/* gunluk grafik */
.gg{display:flex;align-items:flex-end;height:124px;touch-action:manipulation;cursor:pointer}
.gc{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%;padding:0 var(--bosluk,2px)}
.gc i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--mavi)}
.gc i.bos{background:#DCE2FF}.gc i.son{background:var(--turuncu)}.gc i.sec{outline:2px solid var(--lac);outline-offset:1px}
.gl{display:flex;margin-top:6px;height:16px}
.gl div{flex:1;display:flex;justify-content:center}
.gl span{font-size:11px;color:var(--yazi2);white-space:nowrap}
.okuma{margin:10px 0 0;font-size:13px;color:var(--yazi2);min-height:19px}.okuma b{color:var(--yazi)}
/* dersler */
.serit{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin-bottom:12px}
.serit i{display:block;min-width:3px}
.dl-b,.dl{display:grid;grid-template-columns:minmax(0,1fr) 78px 62px;gap:8px;align-items:center}
.dl-b{font-size:11.5px;color:var(--yazi2);padding-bottom:6px;border-bottom:1px solid #EEF1FB}.dl-b span:nth-child(n+2),.dl>span:nth-child(n+2){text-align:right}
.dl{min-height:44px;border-bottom:1px solid #F1F3FC;font-size:14px}.dl:last-child{border-bottom:0}
.dl-a{display:flex;align-items:center;gap:8px;min-width:0}.dl-a i{width:10px;height:10px;border-radius:3px;flex:none}.dl-a b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .yk{color:var(--kirmizi);font-weight:800}.dl .yy{color:var(--yesil);font-weight:800}.dl .yn{color:var(--yazi2)}
/* denemeler */
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cipler button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--cizgi);background:#fff;color:var(--mavi);font-size:13px;font-weight:700}
.cipler button.on{background:var(--mavi);border-color:var(--mavi);color:#fff}
.dg{display:flex;align-items:flex-end;height:130px;gap:6px}
.dg div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.dg b{font-size:11px;margin-bottom:3px}
.dg i{display:block;width:100%;max-width:30px;border-radius:4px 4px 0 0;background:var(--mavi)}.dg i.son{background:var(--turuncu)}
.dgl{display:flex;gap:6px;margin-top:5px}.dgl span{flex:1;text-align:center;font-size:10.5px;color:var(--yazi2);white-space:nowrap}
.dn{display:flex;justify-content:space-between;gap:8px;min-height:40px;align-items:center;border-bottom:1px solid #F1F3FC;font-size:14px}.dn:last-child{border-bottom:0}
.dn-t{margin:14px 0 4px;font-size:13px;font-weight:700}
/* notlar */
.nt{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #F1F3FC}.nt:last-child{border-bottom:0}
.nt b{display:block;font-size:14px}.nt small{display:block;font-size:12px;color:var(--yazi2);margin-top:2px}.nt>span{font-size:12.5px;color:var(--yazi);text-align:right;white-space:nowrap}
/* analiz + mesaj */
.analiz{background:#FFF4EA;border:1px solid #FFD2A6}.analiz h2{color:#9A3412}
.analiz ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.analiz li{font-size:14px;line-height:1.5;color:var(--yazi)}.analiz li b.n{color:#9A3412}.analiz li b.p{color:var(--yesil)}
.ms{white-space:pre-wrap;margin:0 0 12px;font-size:14px;line-height:1.55;background:#F4F6FF;border-radius:12px;padding:12px}
.mt{width:100%;min-height:170px;margin:0 0 12px;border:1px solid var(--cizgi);border-radius:12px;padding:12px;font:inherit;font-size:14px;line-height:1.5;color:var(--yazi)}
.mb{display:flex;gap:8px}
.mb button{flex:1;min-height:48px;border-radius:14px;font-size:14.5px;font-weight:800;border:0}
.mb .b1{background:#E3E8FF;color:var(--mavi)}.mb .b2{background:var(--turuncu);color:var(--lac)}
</style>
</head>
<body>

<!-- ============ GIRIS ============ -->
<section id="giris" class="kap" hidden>
<div>
<div class="logo" aria-hidden="true">M<i>!</i></div>
<h1>Koç Paneli</h1>
<p class="alt">Öğrencilerinin çalışma süresini, soru notlarını ve deneme netlerini tek yerden takip et.</p>
</div>
<form class="g-form" id="g-form">
<label for="g-sifre">Panel şifresi</label>
<input id="g-sifre" type="password" autocomplete="current-password" required>
<label class="g-hat"><input type="checkbox" id="g-hatirla" checked> Bu telefonda beni hatırla</label>
<button type="submit" class="g-btn" id="g-btn">Giriş yap</button>
<p class="g-hata" id="g-hata" role="alert"></p>
</form>
<p class="g-not">Sadece sen erişebilirsin. Veriler MF Koç Takip tablosundan okunur ve yalnızca koç kodu girip onay veren öğrencileri kapsar.</p>
</section>

<!-- ============ LISTE ============ -->
<section id="liste" hidden>
<header class="ust"><div class="kap ust-s">
<div class="ust-b"><div class="mini-logo" aria-hidden="true">M<i>!</i></div><div><h1>Koç Paneli</h1><small id="l-tarih"></small></div></div>
<div style="display:flex;gap:8px">
<button type="button" class="ikon-b" id="l-yenile" aria-label="Yenile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>
<button type="button" class="ikon-b" id="l-cikis" aria-label="Çıkış yap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
</div>
</div></header>
<main class="ana kap" id="l-ana"></main>
</section>

<!-- ============ DETAY ============ -->
<section id="detay" hidden>
<header class="ust d-ust"><div class="kap">
<div class="ust-s">
<div class="ust-b">
<button type="button" class="ikon-b" id="d-geri" aria-label="Öğrenci listesine dön"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<div style="min-width:0"><h1 id="d-ad"></h1><small id="d-alt"></small></div>
</div>
<span class="et" id="d-et"></span>
</div>
<div class="aralik" role="tablist" aria-label="Aralık" id="d-aralik"><button type="button" role="tab" data-g="7" class="on">7 gün</button><button type="button" role="tab" data-g="30">30 gün</button><button type="button" role="tab" data-g="90">3 ay</button></div>
</div></header>
<main class="ana kap" id="d-ana"></main>
</section>

<script>
(function(){
'use strict';
// ================= AYARLAR =================
// MF Odak ile ayni Apps Script adresi (index.html icindeki KOC_URL)
var KOC_URL='https://script.google.com/macros/s/AKfycbzbFUmUiOH8SKpDHL0BRuQdUU1WigKtZaalZJ3BIW5Q_K_5NkGhw8tei_relqMUatRpDQ/exec';
var SIFRE_K='mf-koc-panel';
var AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var AYK=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
var GK=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
var $=function(id){return document.getElementById(id);};

// ================= YARDIMCILAR =================
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function gunBas(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function gunK(t){var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function sk(dk){dk=Math.round(dk||0);var h=Math.floor(dk/60),m=dk%60;return h?(h+' sa'+(m?' '+m+' dk':'')):(m+' dk');}
function nY(n){return (Math.round(n*100)/100).toString().replace('.',',');}
function yuzde(a,b){return b?Math.round((a-b)*100/b):null;}
function onceYaz(n){return n===null?'hiç':n===0?'bugün':n===1?'dün':n+' gün önce';}
function saatYaz(iso){var d=new Date(iso);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function tarihKisa(iso){var d=new Date(iso);return d.getDate()+' '+AYK[d.getMonth()];}
function dersAd(x){x=String(x||'').trim();return /^(TYT|AYT) Matematik$/.test(x)?'Matematik':x;}
function denemeMi(ders){return / Deneme$/.test(ders);}
function basHarf(ad){var p=String(ad).trim().split(/\s+/);return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toLocaleUpperCase('tr');}

// ================= VERI =================
// VERI: Apps Script panelVeri() ciktisi
// kayitlar satiri: [isoZaman, kod, ders, dk, tam(0/1), yapti, konu, soru|null, dogru|null, yanlis|null]
// denemeler: {t, kod, sinav, ad, dk, net, d:{dersAdi:net}}
var VERI=null,OGR=[],SIRA='dikkat',SECILI=null,DGUN=7;

function sifreAl(){try{return localStorage.getItem(SIFRE_K)||sessionStorage.getItem(SIFRE_K)||'';}catch(e){return '';}}
function sifreYaz(p,kalici){try{(kalici?localStorage:sessionStorage).setItem(SIFRE_K,p);}catch(e){}}
function sifreSil(){try{localStorage.removeItem(SIFRE_K);sessionStorage.removeItem(SIFRE_K);}catch(e){}}

function veriCek(p){
  return fetch(KOC_URL+'?islem=veri&p='+encodeURIComponent(p)+'&_='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('ag');return r.json();});
}

// ================= HESAP =================
// Bir ogrencinin son `gun` gunluk ozetini cikarir. Detay ekrani da bunu kullanir.
function hesap(kod,gun){
  gun=gun||7;
  var simdi=Date.now(),bugun=gunBas(simdi),bas=bugun-(gun-1)*864e5,oncBas=bas-gun*864e5;
  var K=VERI.kayitlar.filter(function(r){return r[1]===kod;});
  var gunluk={},dersS={},dersO={},top=0,topO=0,tam=0,notlar=[],sq={q:0,d:0,y:0,dr:{}},sqO={q:0,d:0,y:0},sonT=null;
  K.forEach(function(r){
    var t=new Date(r[0]).getTime(),ders=dersAd(r[2]),dk=r[3];
    if(sonT===null||t>sonT)sonT=t;
    if(t>=bas){top+=dk;gunluk[gunK(t)]=(gunluk[gunK(t)]||0)+dk;dersS[ders]=(dersS[ders]||0)+dk;if(r[4])tam++;
      if(r[5]||r[6]||r[7]!==null)notlar.push({t:r[0],ders:ders,dk:dk,yapti:r[5],konu:r[6],soru:r[7],d:r[8],y:r[9]});
      if(r[7]){sq.q+=r[7];var dr=sq.dr[ders]=sq.dr[ders]||{q:0,d:0,y:0};dr.q+=r[7];if(r[8]!==null||r[9]!==null){sq.d+=r[8]||0;sq.y+=r[9]||0;dr.d+=r[8]||0;dr.y+=r[9]||0;}}}
    else if(t>=oncBas){topO+=dk;dersO[ders]=(dersO[ders]||0)+dk;if(r[7]){sqO.q+=r[7];sqO.d+=r[8]||0;sqO.y+=r[9]||0;}}
  });
  var gunler=[],aktif=0;
  for(var i=gun-1;i>=0;i--){var tt=bugun-i*864e5,v=gunluk[gunK(tt)]||0;if(v)aktif++;gunler.push({t:tt,v:v});}
  var seri=0;for(var s=(gunluk[gunK(bugun)]?0:1);s<400;s++){var ok=K.some(function(r){return gunK(new Date(r[0]))===gunK(bugun-s*864e5);});if(ok)seri++;else break;}
  var sonGun=sonT===null?null:Math.round((bugun-gunBas(sonT))/864e5);
  var dogru=sq.d+sq.y?Math.round(sq.d*100/(sq.d+sq.y)):null,dogruO=sqO.d+sqO.y?Math.round(sqO.d*100/(sqO.d+sqO.y)):null;
  var dersDog=Object.keys(sq.dr).filter(function(a){var x=sq.dr[a];return x.d+x.y>=15;}).map(function(a){var x=sq.dr[a];return {ders:a,yz:Math.round(x.d*100/(x.d+x.y)),q:x.q};}).sort(function(a,b){return a.yz-b.yz;});
  // denemeler (tum zamanlar), tarih sirali
  var D=VERI.denemeler.filter(function(x){return x.kod===kod;}).sort(function(a,b){return new Date(a.t)-new Date(b.t);});
  var sonD=D.length?D[D.length-1]:null,sonDFark=null;

// 5) koc analizi
function analizYap(h,ad){
  var neg=[],pos=[],ders=function(a){return !denemeMi(a);};
  if(h.sonGun!==null&&h.sonGun>=3)neg.push({k:esc(h.sonGun)+' gündür çalışma kaydı yok. Bugün kısa bir mesajla durumunu sor.',o:'Birkaç gündür görüşemedik, her şey yolunda mı? Bugün sadece 25 dakikalık tek bir seansla yeniden başlayalım mı?'});
  if(h.topO&&h.fark!==null&&h.fark<=-25)neg.push({k:'Çalışma süresi %'+(-h.fark)+' düştü ('+sk(h.topO)+' → '+sk(h.top)+'). Yoğunluk mu, motivasyon mu olduğunu konuş.',o:'Bu aralar çalışma süren biraz azalmış. Programı biraz hafifletelim; bugün tek bir derse odaklanman yeter.'});
  var zay=h.dersDog.filter(function(x){return ders(x.ders)&&x.yz<60;})[0];
  if(zay)neg.push({k:esc(zay.ders)+' doğruluğu %'+zay.yz+' ('+zay.q+' soru). Konu eksiği olabilir, kısa bir tekrar planla.',o:zay.ders+' dersinde yanlışların biraz fazla. Bu hafta 2 kısa konu tekrarı yapıp ardından yanlışlarına bakalım.'});
  var kay=Object.keys(h.dersO).filter(function(a){return ders(a)&&!h.dersS[a];}).sort(function(a,b){return h.dersO[b]-h.dersO[a];})[0];
  if(kay)neg.push({k:esc(kay)+' dersinde bu dönem hiç çalışılmamış (öncekinde '+sk(h.dersO[kay])+'). Programa geri koy.',o:kay+' dersini bu hafta programına geri alalım; günde 20 dakika bile işe yarar.'});
  if(h.sonDFark!==null&&h.sonDFark<0)neg.push({k:esc(h.sonD.sinav)+' denemesinde net '+nY(-h.sonDFark)+' düşmüş. Hangi derslerde düştüğüne bak.',o:'Son denemede net biraz düşmüş. Yanlışlarını konu konu işaretleyelim; bir sonraki denemede hedefimiz bu.'});
  if(h.topO&&h.fark!==null&&h.fark>=15)pos.push({k:'Çalışma süresi %'+h.fark+' arttı ('+sk(h.topO)+' → '+sk(h.top)+').',o:'Önceki döneme göre %'+h.fark+' daha fazla çalışmışsın, harika gidiyorsun!'});
  if(h.dogru!==null&&h.dogruO!==null&&h.dogru-h.dogruO>=5)pos.push({k:'Soru doğruluğu %'+h.dogruO+' → %'+h.dogru+' yükseldi.',o:'Soru doğruluğun %'+h.dogruO+'\'den %'+h.dogru+'\'a çıkmış, emeğinin karşılığını alıyorsun!'});
  if(h.sonDFark!==null&&h.sonDFark>0)pos.push({k:'Son denemede '+nY(h.sonDFark)+' net artış var.',o:'Son denemede '+nY(h.sonDFark)+' net artış var, tebrikler!'});
  if(h.aktif>=Math.ceil(h.gun*0.7)||h.seri>=3)pos.push({k:h.gun+' günün '+h.aktif+'\'inde çalışmış'+(h.seri>=3?', '+h.seri+' günlük seri sürüyor':'')+'. Düzenli.',o:'Çalışma düzenin çok iyi, '+h.aktif+' gün çalışmışsın. Bu ritim sana çok şey kazandıracak!'});
  if(!pos.length&&h.aktif>0)pos.push({k:'Bu aralıkta '+h.aktif+' gün çalışmış; üzerine koyabileceğin bir temel var.',o:'Bu dönemde '+h.aktif+' gün çalışmışsın, güzel bir başlangıç. Üzerine koymak kolay olacak!'});
  if(!pos.length&&h.topO>0)pos.push({k:'Önceki dönemde '+sk(h.topO)+' çalışmıştı; ritmi daha önce yakalamış.',o:'Daha önce güzel bir ritim yakalamıştın, oraya dönmek senin elinde.'});
  var it=neg.length?neg.slice(0,2).concat(pos.slice(0,1)):pos.slice(0,2);

  return {neg:neg.slice(0,2),pos:neg.length?pos.slice(0,1):pos.slice(0,2),msj:msj,bos:!it.length};
}

    '<div class="oz"><span>Çalıştığı gün</span><b>'+h.aktif+' / '+DGUN+'</b><small>seri: '+h.seri+' gün</small></div>'+
    '<div class="oz"><span>Çözülen soru</span><b>'+h.soru.q+'</b><small>'+(h.dogru!==null?'%'+h.dogru+' doğru':'doğru/yanlış girilmedi')+'</small></div>'+
    '<div class="oz"><span>Son çalışma</span><b>'+onceYaz(h.sonGun)+'</b><small>'+h.tam+' tam pomodoro</small></div></section>';
  o+=bolumler(h,o0);
  $('d-ana').innerHTML=o;baglaDetay(h);
}
$('d-aralik').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;DGUN=+b.dataset.g;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b);});detayCiz();});
$('d-geri').addEventListener('click',function(){if(history.state&&history.state.d)history.back();else goster('liste');});
window.addEventListener('popstate',function(){if(!$('detay').hidden)goster('liste');});

// ---------- YUKLEME ----------
function yukle(p,ilk){
  $('l-ana').innerHTML='<div class="yuk"><i></i> Veriler getiriliyor…</div>';
  return veriCek(p).then(function(v){
    if(v.hata){
      if(v.hata==='sifre'){sifreSil();girisGoster('Şifre hatalı.');}
      else if(v.hata==='sifre-ayarlanmamis'){girisGoster('Apps Script\'te PANEL_SIFRE henüz ayarlanmamış.');}
      else girisGoster('Tablo okunamadı: '+(v.ayrinti||v.hata));
      return false;}
    VERI=v;hazirla();listeCiz();if(!$('detay').hidden&&SECILI)detayCiz();else goster('liste');return true;
  }).catch(function(){
    if(ilk)girisGoster('Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.');
    else $('l-ana').innerHTML='<div class="bos-kutu">Bağlantı kurulamadı. Yenile butonuyla tekrar dene.</div>';
    return false;});
}
function girisGoster(hata){$('g-hata').textContent=hata||'';$('g-btn').disabled=false;$('g-btn').textContent='Giriş yap';goster('giris');}
$('g-form').addEventListener('submit',function(e){e.preventDefault();var p=$('g-sifre').value;if(!p)return;
  $('g-btn').disabled=true;$('g-btn').textContent='Giriş yapılıyor…';$('g-hata').textContent='';
  goster('liste');yukle(p,true).then(function(ok){if(ok){sifreYaz(p,$('g-hatirla').checked);$('g-sifre').value='';}});});
$('l-yenile').addEventListener('click',function(){var p=sifreAl();if(p)yukle(p,false);else girisGoster();});
$('l-cikis').addEventListener('click',function(){sifreSil();VERI=null;OGR=[];girisGoster();});

var kayitli=sifreAl();
if(kayitli){goster('liste');yukle(kayitli,true);}else girisGoster();

// Test ve gelistirme icin
window.MF_PANEL={hesap:function(k,g){return hesap(k,g);},veri:function(){return VERI;}};
})();
</script>
